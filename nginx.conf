server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # MIME types configuration for WebAssembly and modern web assets
    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js mjs;
        application/wasm                      wasm;
        application/json                      json;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/svg+xml                         svg;
        image/x-icon                          ico;
        font/woff2                            woff2;
    }

    # Enable Gzip Compression for fast WASM / JS loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;
    gzip_min_length 1000;

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Android App Links verification — не перехватывается SPA fallback
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Deep link paths — не кэшируются, всегда отдаётся index.html
    location ~* ^/(lobby|pack)/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }

    # Cache static resources (WASM binaries, JS bundles, Compose Resources)
    location ~* \.(wasm|js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
