name: Mobile Release (Android APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version tag (e.g. v1.0.3)'
        required: true
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    environment: KEYSTORE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore (if GitHub Secret is provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > key.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          else
            echo "No KEYSTORE_BASE64 secret found. Gradle will build using default/unsigned config."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Prepare APK artifact
        id: prepare_apk
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_name }}" ]; then
            VERSION_TAG="${{ inputs.version_name }}"
          fi

          APK_PATH=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            OUTPUT_NAME="MemeBattle-${VERSION_TAG}.apk"
            cp "$APK_PATH" "$OUTPUT_NAME"
            echo "apk_name=$OUTPUT_NAME" >> $GITHUB_OUTPUT
            echo "Prepared APK: $OUTPUT_NAME"
          else
            echo "Error: Release APK build output not found!"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || inputs.version_name }}
          name: Release ${{ github.ref_name != 'main' && github.ref_name || inputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.prepare_apk.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
