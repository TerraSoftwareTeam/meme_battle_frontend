<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeBattle Web</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #141218;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 0;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(124, 93, 250, 0.2);
            border-top: 4px solid #7C5DFA;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="loading-spinner">
        <div class="spinner"></div>
    </div>
    <div id="ComposeTarget"></div>
    <script type="text/javascript" src="webApp.js"></script>
</body>
</html>
